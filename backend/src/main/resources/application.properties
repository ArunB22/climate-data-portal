spring.application.name=climate-data-portal

# Render (and most PaaS Docker runners) assign the port at runtime via PORT;
# the JVM must bind to it, not the hardcoded 8080 default.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/climate_portal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Dev-only fallback so the app boots without an .env file. Every real
# deployment MUST set JWT_SECRET explicitly — see .env.example.
app.jwt.secret=${JWT_SECRET:wBygQM4+I4eOFzxPlpm7e/1E9HoApFu7BDYL3Inrk52X+re28O8wIgpmoNBnIxMC-dev-only}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.super-admin.email=${SUPER_ADMIN_EMAIL:superadmin@vasudhaindia.org}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:Admin@123}
